name: Pages

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Confirm custom domain file
        run: test "$(cat dist/CNAME)" = "cliffweng.com" && test -f dist/.nojekyll

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: site-dist
          path: dist
          if-no-files-found: error

      # Pages is set to publish the gh-pages branch (legacy branch deploy).
      # Pushing dist there keeps cliffweng.com on the existing CNAME.
      # Pull requests build and upload an artifact only — they do not publish.
      - name: Publish dist to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: cliffweng.com
          keep_files: false
          force_orphan: true
